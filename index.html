<!DOCTYPE HTML>

<html>
    <head>
        <title></title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
                            
        <div class="container">
            <h3>Metric/Imperial Unit Conversion</h3>
            <input type="number" id="input-el" placeholder="   Value">
            <button id="convert-btn">Convert</button>

            <div class="results">
                <div class="card">
                    <h3>Length (Meter/Feet)</h3>
                    <p id="lengthResult"></p>
                </div>

                <div class="card">
                    <h3>Volume (Liters/Gallons)</h3>
                    <p id="volumeResult"></p>
                </div>

                <div class="card">
                    <h3>Mass (Kilograms/Pounds)</h3>
                    <p id="massResult"></p>
                </div>

                <div class="card">
                    <h3>Distance (Kilometers/Miles)</h3>
                    <p id="distResult"></p>
                </div>
            </div>
        </div>
                            
        <script src="script.js"></script>
    </body>
</html>
